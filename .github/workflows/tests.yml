name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-synthetic-gui:
    # Hardware-in-the-loop and long soak tests are never run here.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Vendor app-local dependencies from the lock file
        run: python -X utf8 tools/vendor_dependencies.py
      - name: Run unit and synthetic GUI tests
        shell: pwsh
        run: |
          # Helper processes use runtime.PYTHON; point it at the runner's interpreter.
          $env:RADIALOG_SCIENCE_PYTHON = Join-Path $env:pythonLocation 'python.exe'
          python -X utf8 -m unittest discover -s tests -v
